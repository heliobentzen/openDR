<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OWL – openDR</title>
  <link href="{{ url_for('static', filename='css/tailwind.css') }}" rel="stylesheet">
</head>

<body class="relative min-h-screen bg-slate-950 flex items-center justify-center p-4 overflow-hidden antialiased">

  <!-- Ambient background glow -->
  <div class="pointer-events-none absolute inset-0 overflow-hidden">
    <div class="absolute -top-40 -left-32 h-96 w-96 rounded-full bg-amber-500/20 blur-[120px]"></div>
    <div class="absolute -bottom-40 -right-32 h-96 w-96 rounded-full bg-teal-500/10 blur-[120px]"></div>
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_1px_1px,rgba(255,255,255,0.04)_1px,transparent_0)] bg-[size:28px_28px]"></div>
  </div>

  <div class="relative w-full max-w-sm">
    <div class="rounded-3xl bg-slate-900/70 backdrop-blur-xl shadow-2xl shadow-black/40 p-8 border border-white/10 ring-1 ring-white/5">

      <!-- Header -->
      <div class="text-center mb-8">
        <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-amber-400 to-amber-600 shadow-lg shadow-amber-500/30">
          <svg class="h-7 w-7 text-slate-900" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
        </div>
        <h1 class="text-4xl font-bold tracking-wide bg-gradient-to-r from-amber-300 to-amber-500 bg-clip-text text-transparent">OWL</h1>
        <p class="text-slate-400 text-sm mt-2">openDR &mdash; Retinal Fundus System</p>
      </div>

      <!-- Patient ID Form -->
      <form action="." method="POST">
        <label for="patient-id" class="block text-slate-300 text-sm font-medium mb-2">
          Patient MR Number
        </label>
        <input
          id="patient-id"
          type="text"
          name="text"
          autocomplete="off"
          placeholder="e.g.&nbsp;MR12345"
          class="w-full bg-slate-950/60 text-white border border-white/10 rounded-xl px-4 py-3 text-base placeholder-slate-500 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition"
        >
        <button
          type="submit"
          name="my-form"
          class="mt-4 w-full inline-flex items-center justify-center gap-2 bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-300 hover:to-amber-400 active:scale-[0.98] text-slate-900 font-semibold py-3 rounded-xl transition-all duration-150 text-sm tracking-wide shadow-lg shadow-amber-500/25 hover:shadow-amber-400/35 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-400 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-900"
        >
          Start Session
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
          </svg>
        </button>
      </form>

    </div>

    <p class="mt-4 text-center text-[11px] text-slate-600 tracking-wide">Raspberry Pi retinal capture &amp; DR screening</p>
  </div>
</body>
</html>
